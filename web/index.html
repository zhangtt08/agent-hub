<div class="grain" aria-hidden="true"></div>

<div class="titlebar" id="titlebar" hidden>
  <div class="titlebar__brand" data-tauri-drag-region>
    <span class="titlebar__mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><rect x="3.2" y="3.2" width="17.6" height="17.6" rx="6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 7.2 16.4 12 12 16.8 7.6 12Z" fill="currentColor"/></svg>
    </span>
    <span class="titlebar__name" data-tauri-drag-region>Agent 对话管理</span>
    <span class="titlebar__tag" data-tauri-drag-region>本机 · 离线</span>
  </div>
  <div class="titlebar__drag" data-tauri-drag-region></div>
  <div class="titlebar__actions">
    <button type="button" id="winMin" aria-label="最小化" title="最小化">
      <svg viewBox="0 0 24 24"><path d="M6 12h12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <button type="button" id="winMax" aria-label="最大化" title="最大化">
      <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
    </button>
    <button type="button" id="winClose" class="is-close" aria-label="关闭" title="关闭">
      <svg viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </div>
</div>

<div class="app">
  <aside class="sidebar">
    <a class="brand" href="#top" aria-label="回到顶部">
      <span class="brand__mark">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3.2" y="3.2" width="17.6" height="17.6" rx="6" fill="none" stroke="currentColor" stroke-width="1.7"/>
          <path d="M12 7.2 16.4 12 12 16.8 7.6 12Z" fill="currentColor"/>
        </svg>
      </span>
    </a>

    <nav class="nav" aria-label="主导航">
      <button class="nav__item is-active" type="button" data-view="overview"><svg><use href="#i-home"/></svg><span>概览</span></button>
      <button class="nav__item" type="button" data-view="sessions"><svg><use href="#i-chat"/></svg><span>会话</span></button>
      <button class="nav__item" type="button" data-view="projects"><svg><use href="#i-folder"/></svg><span>项目</span></button>
      <button class="nav__item" type="button" data-view="stats"><svg><use href="#i-chart"/></svg><span>统计</span></button>
      <button class="nav__item" type="button" data-view="settings"><svg><use href="#i-gear"/></svg><span>设置</span></button>
    </nav>

    <div class="storage" id="storageBox">
      <div class="storage__label"><span>本地索引</span><b id="storageSize">—</b></div>
      <div class="storage__bar"><i id="storageBar"></i></div>
      <p id="storageMeta">正在读取…</p>
    </div>

    <div class="user">
      <span class="user__avatar" aria-hidden="true">T</span>
      <div class="user__meta">
        <span class="user__name" id="userName">本机</span>
        <span class="user__plan">只在本机运行</span>
      </div>
    </div>
  </aside>

  <main class="main" id="top">
    <section class="view is-active" id="view-overview" data-view="overview">
    <header class="topbar">
      <div class="topbar__title">
        <h1>Agent 对话管理</h1>
        <p class="topbar__sub" id="scanMeta">正在扫描本机 Agent 数据…</p>
      </div>
      <div class="controls">
        <label class="search">
          <svg><use href="#i-search"/></svg>
          <input id="globalSearch" type="search" placeholder="搜索会话、项目或路径…" aria-label="搜索会话、项目或路径" autocomplete="off">
          <kbd>⌘K</kbd>
        </label>
        <button class="icon-btn" type="button" id="rescanBtn" aria-label="重新扫描" title="重新扫描">
          <svg><use href="#i-refresh"/></svg>
        </button>
      </div>
    </header>

    <section class="kpis" id="kpis" aria-label="核心指标"></section>

    <section class="mid" id="sessions">
      <section class="panel panel--agents" aria-labelledby="agentsTitle">
        <div class="panel__head">
          <div>
            <h2 id="agentsTitle">Agent 对话总览</h2>
            <p>自动识别本机 Agent 的会话文件，按来源汇总</p>
          </div>
          <span class="link" id="agentDetected"></span>
        </div>
        <div class="agents" id="agents"></div>
        <p class="agents__note" id="agentsNote"></p>
      </section>

      <section class="clean" id="clean" aria-labelledby="cleanTitle">
        <div class="clean__head">
          <h2 id="cleanTitle">清理中心</h2>
          <button class="link" type="button" id="cleanHint">
            按文件清理 <svg><use href="#i-info"/></svg>
          </button>
        </div>
        <p class="clean__lead">发现 <b id="cleanLead">0</b> 个可清理会话，合计 <b id="cleanLeadSize">0</b></p>
        <div class="clean__list" id="buckets"></div>
        <p class="clean__hint" id="cleanTip" hidden></p>
        <button class="btn-dark" type="button" id="cleanBtn">
          <svg><use href="#i-trash"/></svg>
          <span id="cleanBtnLabel">清理选中项</span>
          <svg class="arrow"><use href="#i-arrow"/></svg>
        </button>
      </section>
    </section>

    <section class="bottom">
      <section class="panel table-panel" aria-labelledby="tableTitle">
        <h2 id="tableTitle" hidden>会话记录</h2>
        <div class="tabs" role="tablist" aria-label="会话视图">
          <button class="tab is-active" role="tab" aria-selected="true" data-tab="all">全部会话<span class="tab__count" id="countAll">0</span></button>
          <button class="tab" role="tab" aria-selected="false" data-tab="recent">最近 7 天</button>
          <button class="tab" role="tab" aria-selected="false" data-tab="archived">已归档<span class="tab__count" id="countArchived">0</span></button>
        </div>
        <div class="filters">
          <select class="select" id="agentFilter" aria-label="按 Agent 筛选">
            <option value="all">全部 Agent</option>
          </select>
          <select class="select" id="statusFilter" aria-label="按状态筛选">
            <option value="all">全部状态</option>
            <option value="active">活跃</option>
            <option value="archived">已归档</option>
            <option value="large">大文件</option>
          </select>
          <label class="filters__search">
            <svg><use href="#i-search"/></svg>
            <input id="tableSearch" type="search" placeholder="搜索会话标题或项目…" aria-label="搜索会话标题或项目" autocomplete="off">
          </label>
          <div class="bulk" id="bulkBar" hidden>
            <span id="bulkCount">已选 0 项</span>
            <button type="button" id="bulkArchive">归档</button>
            <button type="button" id="bulkDelete">删除</button>
          </div>
        </div>
        <div class="table-wrap" id="tablePanel" role="tabpanel">
          <table>
            <colgroup>
              <col style="width:34px"><col style="width:56px"><col style="width:132px">
              <col><col style="width:62px"><col style="width:74px"><col style="width:78px">
              <col style="width:62px"><col style="width:132px">
            </colgroup>
            <thead>
              <tr>
                <th class="c-check">
                  <label class="check">
                    <input type="checkbox" id="checkAll" aria-label="全选">
                    <span class="check__box"><svg><use href="#i-check"/></svg></span>
                  </label>
                </th>
                <th>Agent</th>
                <th>项目</th>
                <th>会话</th>
                <th class="t-right">消息</th>
                <th class="t-right">大小</th>
                <th>最后更新</th>
                <th>状态</th>
                <th style="text-align:right">操作</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr class="skeleton-row"><td colspan="9"><div class="skeleton"></div></td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="panel preview" aria-labelledby="previewTitle">
        <div class="panel__head">
          <h2 id="previewTitle">会话预览</h2>
          <button class="link" type="button" id="openFolderBtn" hidden>
            打开所在位置 <svg><use href="#i-external"/></svg>
          </button>
        </div>
        <div class="preview__body" id="previewBody">
          <div class="preview__empty">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chat"/></svg>
            <p>选择左侧任意会话，查看对话内容</p>
          </div>
        </div>
      </section>
    </section>
    </section>

    <section class="view" id="view-sessions" data-view="sessions">
      <header class="topbar">
        <div class="topbar__title">
          <h1>会话</h1>
          <p class="topbar__sub" id="sessionsMeta">按最近更新排序</p>
        </div>
        <div class="controls">
          <label class="search">
            <svg><use href="#i-search"/></svg>
            <input id="sessionSearch" type="search" placeholder="搜索标题、项目或路径…" aria-label="搜索会话" autocomplete="off">
          </label>
        </div>
      </header>
      <div class="browser">
        <section class="browser__list" aria-label="会话列表">
          <div class="listbar">
            <select class="select" id="sessionAgentFilter" aria-label="按 Agent 筛选"></select>
            <select class="select" id="sortSelect" aria-label="排序">
              <option value="recent">最近更新</option>
              <option value="size">占用最大</option>
              <option value="messages">消息最多</option>
            </select>
            <button class="chip" type="button" id="starFilter" aria-pressed="false">★ 收藏</button>
            <span class="listbar__count" id="listCount"></span>
          </div>
          <div class="rows" id="sessionRows" role="listbox" aria-label="会话"></div>
        </section>
        <section class="browser__detail" id="transcriptPane" aria-label="会话内容">
          <div class="transcript__empty" id="transcriptEmpty">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chat"/></svg>
            <p>从左侧选择一条会话，查看完整对话</p>
          </div>
          <div class="transcript" id="transcript" hidden>
            <header class="transcript__head">
              <div class="transcript__title">
                <h2 id="tTitle"></h2>
                <p id="tMeta"></p>
              </div>
              <div class="transcript__actions">
                <button class="ghost-btn" type="button" id="tStar">收藏</button>
                <button class="ghost-btn" type="button" id="tPrompts">只看提问</button>
                <button class="ghost-btn" type="button" id="tCopyPath">复制路径</button>
                <button class="ghost-btn" type="button" id="tExport">导出 Markdown</button>
                <button class="ghost-btn" type="button" id="tReveal">打开位置</button>
                <button class="ghost-btn" type="button" id="tArchive">归档</button>
                <button class="ghost-btn ghost-btn--danger" type="button" id="tDelete">删除</button>
              </div>
            </header>
            <div class="transcript__scroll" id="tScroll"></div>
          </div>
        </section>
      </div>
    </section>

    <section class="view" id="view-projects" data-view="projects">
      <header class="topbar">
        <div class="topbar__title">
          <h1>项目</h1>
          <p class="topbar__sub" id="projectsMeta">按项目汇总会话与占用</p>
        </div>
      </header>
      <div class="cards" id="projectCards"></div>
    </section>

    <section class="view" id="view-stats" data-view="stats">
      <header class="topbar">
        <div class="topbar__title">
          <h1>统计</h1>
          <p class="topbar__sub" id="statsMeta">本机索引的分布与清理空间</p>
        </div>
      </header>
      <div class="stats" id="statsBody"></div>
    </section>

    <section class="view" id="view-settings" data-view="settings">
      <header class="topbar">
        <div class="topbar__title">
          <h1>设置</h1>
          <p class="topbar__sub" id="settingsMeta">数据来源、删除方式与本机信息</p>
        </div>
      </header>
      <div class="settings" id="settingsBody"></div>
    </section>
  </main>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal__scrim" data-close></div>
  <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <header class="modal__head">
      <h3 id="modalTitle">确认</h3>
      <button class="icon-btn icon-btn--ghost" type="button" data-close aria-label="关闭"><svg><use href="#i-close"/></svg></button>
    </header>
    <div class="modal__body" id="modalBody"></div>
    <footer class="modal__foot" id="modalFoot"></footer>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="busy" id="busy" hidden><div class="busy__inner"><span class="spinner"></span><span id="busyText">正在扫描…</span></div></div>

<script src="app.js" type="module"></script>
</body>
</html>
