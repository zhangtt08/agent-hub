name: build-windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: npm install --no-save @tauri-apps/cli@2
      - name: Build
        run: npx tauri build --bundles nsis
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/agent-hub.exe out/AgentHub.exe
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Copy-Item -Destination out/
          Get-ChildItem out | Format-Table Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: AgentHub-windows-x64
          path: out/*
          if-no-files-found: error
